name: CI Quality Gate

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Release Metadata Script
        run: node --test scripts/release-meta.test.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  rust-and-bundle:
    name: Test & Build (${{ matrix.label }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (deb/rpm/AppImage)
            platform: ubuntu-22.04
            rust_targets: ""
            tauri_args: ""
          - label: Windows (exe/msi/portable)
            platform: windows-latest
            rust_targets: ""
            tauri_args: ""
          - label: macOS (dmg/app.tar.gz)
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Bundles (Stable)
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: npx tauri build --ci ${{ matrix.tauri_args }}

      - name: Smoke Test Windows Beta MSI & NSIS Bundling
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npx tauri bundle --ci --no-binary-patching -c '{"version":"1.1.0-beta.1","bundle":{"windows":{"wix":{"version":"1.1.0.1"}}}}'
