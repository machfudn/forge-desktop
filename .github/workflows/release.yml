name: Release Build Matrix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 1.2.0 atau 1.2.0-beta.1; kosong = pakai versi manifest)"
        required: false
        default: ""
      channel:
        description: "Channel rilis"
        type: choice
        options:
          - auto
          - stable
          - beta
        default: auto
      draft:
        description: "Buat sebagai draft release"
        type: boolean
        default: false
      notes:
        description: "Catatan rilis tambahan (opsional)"
        required: false
        default: ""
permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      draft: ${{ steps.meta.outputs.draft }}
      wix_version: ${{ steps.meta.outputs.wix_version }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute Release Metadata
        id: meta
        env:
          RELEASE_REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || 'auto' }}
          INPUT_DRAFT: ${{ inputs.draft && 'true' || 'false' }}
        run: node scripts/release-meta.mjs

      - name: Generate Channel Release Notes (Stable / Beta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || 'auto' }}
          INPUT_DRAFT: ${{ inputs.draft && 'true' || 'false' }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          CUSTOM_NOTES: ${{ inputs.notes || '' }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" \
            -f target_commitish="${{ github.sha }}" \
            --jq '.body' > generated-notes.md 2>/dev/null || true
          if [ ! -s generated-notes.md ]; then
            if [ "$PRERELEASE" = "true" ]; then
              PREV_TAG=$(git -c versionsort.suffix=- tag --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n1 || true)
            else
              PREV_TAG=$(git -c versionsort.suffix=- tag --sort=-v:refname | grep -Fxv "$TAG_NAME" | grep -Ev -- '-' | head -n1 || true)
            fi
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" > generated-notes.md || true
            else
              git log -n 20 --pretty=format:"- %s (%h)" > generated-notes.md || true
            fi
          fi
          GENERATED_NOTES_FILE=generated-notes.md node scripts/release-meta.mjs notes --out release-notes.md

      - name: Create or Reuse GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DRAFT: ${{ steps.meta.outputs.draft }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CUSTOM_NOTES: ${{ inputs.notes || '' }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            FLAGS=(--title "$RELEASE_NAME" --target "${{ github.sha }}" --notes-file release-notes.md)
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease --latest=false)
            else
              FLAGS+=(--latest)
            fi
            if [ "$DRAFT" = "true" ]; then
              FLAGS+=(--draft)
            fi
            gh release create "$TAG_NAME" "${FLAGS[@]}"
          elif [ -n "$CUSTOM_NOTES" ]; then
            gh release edit "$TAG_NAME" --notes-file release-notes.md
          fi
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=20" --jq ".[] | select(.tag_name==\"$TAG_NAME\") | .id" | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            echo "Gagal mendapatkan release_id untuk $TAG_NAME"
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build (${{ matrix.platform }} / ${{ needs.prepare.outputs.channel }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file xdg-utils

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Sync Manifest Versions & Beta WiX Version
        env:
          RELEASE_REF_NAME: ${{ needs.prepare.outputs.tag_name }}
          INPUT_VERSION: ${{ needs.prepare.outputs.version }}
          INPUT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          INPUT_DRAFT: ${{ needs.prepare.outputs.draft }}
        run: node scripts/release-meta.mjs sync

      - name: Build & Upload Tauri Bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Package & Upload Windows Portable (.exe & .zip)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bin = "src-tauri/target/release/forge-desktop.exe"
          if (-not (Test-Path $bin)) { throw "Binary $bin tidak ditemukan" }
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          $portableExe = "dist-portable/Forge-Desktop_${env:VERSION}_windows_x64-portable.exe"
          $portableZip = "dist-portable/Forge-Desktop_${env:VERSION}_windows_x64-portable.zip"
          Copy-Item $bin $portableExe -Force
          $stageDir = "dist-portable/stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $bin "$stageDir/Forge Desktop.exe" -Force
          New-Item -ItemType File -Force -Path "$stageDir/.portable" | Out-Null
          Compress-Archive -Path (Get-ChildItem -Force $stageDir).FullName -DestinationPath $portableZip -Force
          gh release upload $env:TAG_NAME $portableExe $portableZip --clobber

      - name: Package & Upload Linux Portable (.tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BIN="src-tauri/target/release/forge-desktop"
          if [ ! -f "$BIN" ]; then
            echo "Binary $BIN tidak ditemukan"
            exit 1
          fi
          mkdir -p dist-portable/stage
          cp "$BIN" dist-portable/stage/forge-desktop
          chmod +x dist-portable/stage/forge-desktop
          OUT="dist-portable/Forge-Desktop_${VERSION}_linux_x64-portable.tar.gz"
          tar -czf "$OUT" -C dist-portable/stage forge-desktop
          gh release upload "$TAG_NAME" "$OUT" --clobber

  finalize-release:
    name: Generate Checksums & Sign Release
    needs: [prepare, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          mkdir -p dist-release
          gh release download "$TAG_NAME" --dir dist-release

      - name: Generate SHA256SUMS and Optional GPG Signature
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY:-}" ] && [ -n "${GPG_KEY_ID:-}" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          rm -f dist-release/SHA256SUMS dist-release/SHA256SUMS.asc
          bash scripts/sign-linux-artifacts.sh dist-release
          FILES=(dist-release/SHA256SUMS)
          if [ -f dist-release/SHA256SUMS.asc ]; then
            FILES+=(dist-release/SHA256SUMS.asc)
          fi
          gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
