name: Release Build Matrix

on:
  push:
    branches:
      - main
      - beta
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 1.2.0 atau 1.2.0-beta.1; kosong = pakai versi manifest)"
        required: false
        default: ""
      channel:
        description: "Channel rilis"
        type: choice
        options:
          - auto
          - stable
          - beta
        default: auto
      draft:
        description: "Buat sebagai draft release"
        type: boolean
        default: false
      notes:
        description: "Catatan rilis tambahan (opsional)"
        required: false
        default: ""
permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      draft: ${{ steps.meta.outputs.draft }}
      wix_version: ${{ steps.meta.outputs.wix_version }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute Release Metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_BRANCH_NAME: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || 'auto' }}
          INPUT_DRAFT: ${{ inputs.draft && 'true' || 'false' }}
        run: |
          {
            git tag -l
            gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' || true
          } | sort -u > existing-tags.txt
          EXISTING_TAGS_FILE=existing-tags.txt node scripts/release-meta.mjs

      - name: Check Existing Release (Auto-Skip Duplicate Branch Push)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH_NAME: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          RELEASE_ROW=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG_NAME\") | [.id, (.assets | length)] | @tsv" | head -n1 || true)
          IFS=$'\t' read -r EXISTING_ID EXISTING_ASSETS <<< "$RELEASE_ROW"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ] && [ -n "$EXISTING_ID" ] && [ "${EXISTING_ASSETS:-0}" -gt 0 ]; then
            echo "Release $TAG_NAME sudah tersedia dengan ${EXISTING_ASSETS} aset (id=$EXISTING_ID). Melewati release otomatis untuk push branch $BRANCH_NAME ini."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "existing_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
          echo "existing_assets=${EXISTING_ASSETS:-0}" >> "$GITHUB_OUTPUT"

      - name: Generate Channel Release Notes (Stable / Beta)
        if: steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF_NAME: ${{ steps.meta.outputs.tag_name }}
          INPUT_VERSION: ${{ steps.meta.outputs.version }}
          INPUT_CHANNEL: ${{ steps.meta.outputs.channel }}
          INPUT_DRAFT: ${{ steps.meta.outputs.draft }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          CUSTOM_NOTES: ${{ inputs.notes || '' }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            PREV_TAG=$(git -c versionsort.suffix=- tag --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n1 || true)
          else
            PREV_TAG=$(git -c versionsort.suffix=- tag --sort=-v:refname | grep -Fxv "$TAG_NAME" | grep -Ev -- '-' | head -n1 || true)
          fi
          if [ -n "$PREV_TAG" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="${{ github.sha }}" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body' > generated-notes.md 2>/dev/null || true
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="${{ github.sha }}" \
              --jq '.body' > generated-notes.md 2>/dev/null || true
          fi
          if ! grep -Eq '^[*-] ' generated-notes.md 2>/dev/null; then
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" || true)
            else
              COMMITS=$(git log -n 20 --pretty=format:"- %s (%h)" || true)
            fi
            if [ -n "$COMMITS" ]; then
              if [ -s generated-notes.md ]; then
                printf '%s\n\n%s\n' "$COMMITS" "$(cat generated-notes.md)" > generated-notes.md
              else
                printf '%s\n' "$COMMITS" > generated-notes.md
              fi
            fi
          fi
          GENERATED_NOTES_FILE=generated-notes.md node scripts/release-meta.mjs notes --out release-notes.md

      - name: Create or Reuse GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_RELEASE: ${{ steps.gate.outputs.should_release }}
          EXISTING_ID: ${{ steps.gate.outputs.existing_id }}
          EXISTING_ASSETS: ${{ steps.gate.outputs.existing_assets }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DRAFT: ${{ steps.meta.outputs.draft }}
          CUSTOM_NOTES: ${{ inputs.notes || '' }}
        run: |
          if [ "$SHOULD_RELEASE" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "release_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE_ID="$EXISTING_ID"
          if [ -z "$RELEASE_ID" ]; then
            if [ "$PRERELEASE" = "true" ]; then
              MAKE_LATEST="false"
            else
              MAKE_LATEST="true"
            fi
            RELEASE_ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="${{ github.sha }}" \
              -f name="$RELEASE_NAME" \
              -F body=@release-notes.md \
              -F prerelease="$PRERELEASE" \
              -F draft="$DRAFT" \
              -f make_latest="$MAKE_LATEST" \
              --jq '.id')
          elif [ "${EXISTING_ASSETS:-0}" = "0" ] || [ -n "$CUSTOM_NOTES" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -f name="$RELEASE_NAME" \
              -F body=@release-notes.md >/dev/null
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "Gagal mendapatkan release_id untuk $TAG_NAME"
            exit 1
          fi
          echo "Using release_id=$RELEASE_ID for $TAG_NAME"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build (${{ matrix.platform }} / ${{ needs.prepare.outputs.channel }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file xdg-utils

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Sync Manifest Versions & Beta WiX Version
        env:
          RELEASE_REF_NAME: ${{ needs.prepare.outputs.tag_name }}
          INPUT_VERSION: ${{ needs.prepare.outputs.version }}
          INPUT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          INPUT_DRAFT: ${{ needs.prepare.outputs.draft }}
        run: node scripts/release-meta.mjs sync

      - name: Build & Upload Tauri Bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Package & Upload Windows Portable (.exe & .zip)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bin = "src-tauri/target/release/forge-desktop.exe"
          if (-not (Test-Path $bin)) { throw "Binary $bin tidak ditemukan" }
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          $portableExe = "dist-portable/Forge-Desktop_${env:VERSION}_windows_x64-portable.exe"
          $portableZip = "dist-portable/Forge-Desktop_${env:VERSION}_windows_x64-portable.zip"
          Copy-Item $bin $portableExe -Force
          $stageDir = "dist-portable/stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $bin "$stageDir/Forge Desktop.exe" -Force
          New-Item -ItemType File -Force -Path "$stageDir/.portable" | Out-Null
          Compress-Archive -Path (Get-ChildItem -Force $stageDir).FullName -DestinationPath $portableZip -Force
          foreach ($filePath in @($portableExe, $portableZip)) {
            $fileName = Split-Path $filePath -Leaf
            $existingId = gh api "repos/${env:REPO}/releases/${env:RELEASE_ID}/assets?per_page=100" --jq ".[] | select(.name==\`"$fileName\`") | .id" | Select-Object -First 1
            if ($existingId) { gh api -X DELETE "repos/${env:REPO}/releases/assets/${existingId}" | Out-Null }
            $encodedName = [Uri]::EscapeDataString($fileName)
            $uploadUrl = "https://uploads.github.com/repos/${env:REPO}/releases/${env:RELEASE_ID}/assets?name=${encodedName}"
            curl.exe -fsSL -X POST -H "Authorization: Bearer ${env:GH_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary "@${filePath}" $uploadUrl | Out-Null
          }

      - name: Package & Upload Linux Portable (.tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BIN="src-tauri/target/release/forge-desktop"
          if [ ! -f "$BIN" ]; then
            echo "Binary $BIN tidak ditemukan"
            exit 1
          fi
          mkdir -p dist-portable/stage
          cp "$BIN" dist-portable/stage/forge-desktop
          chmod +x dist-portable/stage/forge-desktop
          OUT="dist-portable/Forge-Desktop_${VERSION}_linux_x64-portable.tar.gz"
          tar -czf "$OUT" -C dist-portable/stage forge-desktop
          NAME=$(basename "$OUT")
          EXISTING_ID=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq ".[] | select(.name==\"${NAME}\") | .id" | head -n1 || true)
          if [ -n "$EXISTING_ID" ]; then
            gh api -X DELETE "repos/${REPO}/releases/assets/${EXISTING_ID}" >/dev/null
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${OUT}" \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" >/dev/null

      - name: Package & Upload macOS App Archive (.app.tar.gz)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos/Forge Desktop.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Bundle $APP_DIR tidak ditemukan"
            exit 1
          fi
          mkdir -p dist-portable
          OUT="dist-portable/Forge-Desktop_${VERSION}_macos_universal.app.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          NAME=$(basename "$OUT")
          EXISTING_ID=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq ".[] | select(.name==\"${NAME}\") | .id" | head -n1 || true)
          if [ -n "$EXISTING_ID" ]; then
            gh api -X DELETE "repos/${REPO}/releases/assets/${EXISTING_ID}" >/dev/null
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${OUT}" \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" >/dev/null

  finalize-release:
    name: Generate Checksums & Sign Release
    needs: [prepare, build-tauri]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          mkdir -p dist-release
          gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | [.id, .name] | @tsv' | while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            [ -n "$ASSET_ID" ] || continue
            echo "Mengunduh ${ASSET_NAME}..."
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" \
              -o "dist-release/${ASSET_NAME}"
          done

      - name: Generate SHA256SUMS and Optional GPG Signature
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY:-}" ] && [ -n "${GPG_KEY_ID:-}" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          rm -f dist-release/SHA256SUMS dist-release/SHA256SUMS.asc
          bash scripts/sign-linux-artifacts.sh dist-release
          FILES=(dist-release/SHA256SUMS)
          if [ -f dist-release/SHA256SUMS.asc ]; then
            FILES+=(dist-release/SHA256SUMS.asc)
          fi
          for FILE in "${FILES[@]}"; do
            NAME=$(basename "$FILE")
            EXISTING_ID=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq ".[] | select(.name==\"${NAME}\") | .id" | head -n1 || true)
            if [ -n "$EXISTING_ID" ]; then
              gh api -X DELETE "repos/${REPO}/releases/assets/${EXISTING_ID}" >/dev/null
            fi
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${FILE}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" >/dev/null
          done
