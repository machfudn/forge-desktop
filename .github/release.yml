changelog:
  exclude:
    labels:
      - skip-changelog
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
        - bugfix
    - title: Performance & Refactoring
      labels:
        - perf
        - refactor
    - title: UI & Styling
      labels:
        - style
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance & Dependencies
      labels:
        - ci
        - build
        - chore
        - dependencies
    - title: Other Changes
      labels:
        - "*"
